# Deploys the landing page with the APK served from GitHub Pages itself.
#
# Release asset downloads redirect to release-assets.githubusercontent.com, and one of its IPs
# is unreachable on some networks, so roughly 1 in 4 downloads stalled or failed. Pages is
# served from different addresses, so the APK is copied here at build time (never committed).
#
# Only the newest release is published, as AdFree-Tube.apk (one APK for phones and TVs); each deploy replaces the whole site,
# so the previous APK is gone. Every version stays on GitHub Releases. Links add ?v=<version>
# so browsers don't reuse a cached older copy.
name: Deploy Pages

# No "release" trigger: those runs start from the version tag, which the github-pages environment
# refuses, so they always failed. scripts/release.mjs pushes remote-config.json after publishing,
# and that push deploys the new APK.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Build site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir _site
          rsync -a --exclude .git --exclude .github --exclude .assetsignore --exclude _site ./ _site/
          tag=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName')
          [ -n "$tag" ] || { echo "No releases found"; exit 1; }
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern AdFree-Tube.apk --output _site/AdFree-Tube.apk
          echo "Serving $tag"; ls -la _site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
